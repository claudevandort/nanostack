version: 2

# Dev/CI dependencies (pip, npm) aren't shipped to users — they only affect
# our own test pipeline, and CI catches breakage if any bump actually
# regresses something. The cost/benefit of weekly PRs for those didn't pay
# off (PRs piled up, no one merged them). We keep only GitHub Actions
# version bumps, where deprecation breaks CI silently if ignored.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
