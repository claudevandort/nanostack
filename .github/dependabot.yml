version: 2

updates:
  # Python conformance suite.
  - package-ecosystem: pip
    directory: /tests/conformance/python
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  # Python bench driver.
  - package-ecosystem: pip
    directory: /bench
    schedule:
      interval: weekly
    groups:
      bench-deps:
        patterns: ["*"]

  # JS conformance suite.
  - package-ecosystem: npm
    directory: /tests/conformance/js
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns: ["*"]

  # GitHub Actions used by .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
