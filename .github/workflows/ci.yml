name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tests/conformance/go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/conformance/js/package-lock.json

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Install JS conformance deps
        working-directory: tests/conformance/js
        run: npm ci

      # ----- Filesystem backend -----
      - name: Start nanostack (fs backend)
        env:
          NANOSTACK_PORT: '14566'
        run: |
          rm -rf "$RUNNER_TEMP/ns-fs"
          ./zig-out/bin/nanostack --port "$NANOSTACK_PORT" --data-dir "$RUNNER_TEMP/ns-fs" > nanostack-fs.log 2>&1 &
          echo $! > nanostack.pid
          for i in $(seq 1 50); do
            if curl -s -o /dev/null "http://127.0.0.1:${NANOSTACK_PORT}/"; then
              echo "nanostack (fs) ready"
              exit 0
            fi
            sleep 0.1
          done
          echo "nanostack (fs) failed to start" >&2
          cat nanostack-fs.log >&2
          exit 1

      - name: Go conformance (fs)
        working-directory: tests/conformance/go
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
          NANOSTACK_BIN: ${{ github.workspace }}/zig-out/bin/nanostack
        run: go test -v -count=1 ./...

      - name: JS conformance (fs)
        working-directory: tests/conformance/js
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
        run: npm test

      - name: Stop nanostack (fs backend)
        if: always()
        run: |
          if [ -f nanostack.pid ]; then
            kill "$(cat nanostack.pid)" 2>/dev/null || true
            rm -f nanostack.pid
          fi
          if [ -f nanostack-fs.log ]; then
            echo "::group::nanostack-fs.log"
            cat nanostack-fs.log
            echo "::endgroup::"
          fi

      # ----- Ephemeral (in-memory) backend -----
      - name: Start nanostack (mem backend)
        env:
          NANOSTACK_PORT: '14566'
        run: |
          ./zig-out/bin/nanostack --port "$NANOSTACK_PORT" --ephemeral > nanostack-mem.log 2>&1 &
          echo $! > nanostack.pid
          for i in $(seq 1 50); do
            if curl -s -o /dev/null "http://127.0.0.1:${NANOSTACK_PORT}/"; then
              echo "nanostack (mem) ready"
              exit 0
            fi
            sleep 0.1
          done
          echo "nanostack (mem) failed to start" >&2
          cat nanostack-mem.log >&2
          exit 1

      - name: Go conformance (mem)
        working-directory: tests/conformance/go
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
          NANOSTACK_BIN: ${{ github.workspace }}/zig-out/bin/nanostack
        run: go test -v -count=1 ./...

      - name: JS conformance (mem)
        working-directory: tests/conformance/js
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
        run: npm test

      - name: Stop nanostack (mem backend)
        if: always()
        run: |
          if [ -f nanostack.pid ]; then
            kill "$(cat nanostack.pid)" 2>/dev/null || true
          fi
          if [ -f nanostack-mem.log ]; then
            echo "::group::nanostack-mem.log"
            cat nanostack-mem.log
            echo "::endgroup::"
          fi
