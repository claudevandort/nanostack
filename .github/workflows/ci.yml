name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/conformance/python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/conformance/js/package-lock.json

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Verify AWS CLI v2
        run: |
          aws --version
          aws --version 2>&1 | grep -q 'aws-cli/2\.' || { echo "AWS CLI v2 required" >&2; exit 1; }

      - name: Install Python conformance deps
        working-directory: tests/conformance/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: Install AWS CLI conformance deps
        working-directory: tests/conformance/awscli
        run: pip install -r requirements.txt

      - name: Install JS conformance deps
        working-directory: tests/conformance/js
        run: npm ci

      - name: Start nanostack
        env:
          NANOSTACK_PORT: '14566'
        run: |
          rm -rf "$RUNNER_TEMP/ns-fs"
          ./zig-out/bin/nanostack --port "$NANOSTACK_PORT" --data-dir "$RUNNER_TEMP/ns-fs" > nanostack.log 2>&1 &
          echo $! > nanostack.pid
          for i in $(seq 1 50); do
            if curl -s -o /dev/null "http://127.0.0.1:${NANOSTACK_PORT}/"; then
              echo "nanostack ready"
              exit 0
            fi
            sleep 0.1
          done
          echo "nanostack failed to start" >&2
          cat nanostack.log >&2
          exit 1

      - name: Python conformance
        working-directory: tests/conformance/python
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
          NANOSTACK_BIN: ${{ github.workspace }}/zig-out/bin/nanostack
        run: pytest -v -n auto

      - name: AWS CLI conformance
        working-directory: tests/conformance/awscli
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
        run: pytest -v -n auto

      - name: JS conformance
        working-directory: tests/conformance/js
        env:
          NANOSTACK_ENDPOINT: 'http://127.0.0.1:14566'
        run: npm test

      - name: Stop nanostack
        if: always()
        run: |
          if [ -f nanostack.pid ]; then
            kill "$(cat nanostack.pid)" 2>/dev/null || true
            rm -f nanostack.pid
          fi
          if [ -f nanostack.log ]; then
            echo "::group::nanostack.log"
            cat nanostack.log
            echo "::endgroup::"
          fi

      # PR-level smoke check for the Docker release path. The release
      # workflow only targets linux/amd64 + linux/arm64.
      - name: Verify Dockerfile builds + binary runs
        run: |
          zig build release -Dtarget=x86_64-linux-musl -Doptimize=ReleaseFast -Dstrip=true
          mv zig-out/release/x86_64-linux-musl/nanostack ./nanostack-amd64
          file ./nanostack-amd64 | grep -q "statically linked" \
            || { echo "musl binary is NOT statically linked"; file ./nanostack-amd64; exit 1; }
          docker build -t nanostack:pr-test --build-arg TARGETARCH=amd64 -f Dockerfile .
          out="$(docker run --rm nanostack:pr-test --version)"
          echo "Container --version output: $out"
          test "$out" = "nanostack v$(grep '^pub const string' src/version.zig | cut -d'"' -f2)"

  bench:
    name: perf gate (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bench/requirements.txt

      - name: Install bench deps
        run: |
          python -m pip install --upgrade pip
          pip install -r bench/requirements.txt

      - name: Run perf gate
        run: zig build bench -- --backend fs --out "$GITHUB_WORKSPACE/bench-result.json"

      - name: Post bench summary
        if: always()
        run: |
          {
            echo "## Perf gate result"
            if [ -f "$GITHUB_WORKSPACE/bench-result.json" ]; then
              echo ""
              echo '```json'
              cat "$GITHUB_WORKSPACE/bench-result.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: warn
