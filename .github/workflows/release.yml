name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  docker:
    name: Build + push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Resolve version
        id: ver
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile linux/amd64 (musl-static)
        run: |
          zig build release -Dtarget=x86_64-linux-musl -Doptimize=ReleaseFast -Dstrip=true
          mv zig-out/release/x86_64-linux-musl/nanostack ./nanostack-amd64

      - name: Cross-compile linux/arm64 (musl-static)
        run: |
          zig build release -Dtarget=aarch64-linux-musl -Doptimize=ReleaseFast -Dstrip=true
          mv zig-out/release/aarch64-linux-musl/nanostack ./nanostack-arm64

      - name: Verify both binaries are statically linked
        run: |
          file ./nanostack-amd64 | grep -q "statically linked" \
            || { echo "amd64 binary is NOT statically linked"; file ./nanostack-amd64; exit 1; }
          file ./nanostack-arm64 | grep -q "statically linked" \
            || { echo "arm64 binary is NOT statically linked"; file ./nanostack-arm64; exit 1; }
          echo "OK — both statically linked."
          ls -lh ./nanostack-amd64 ./nanostack-arm64

      - name: Smoke test the amd64 binary
        run: |
          out="$(./nanostack-amd64 --version)"
          echo "Output: $out"
          test "$out" = "nanostack v${{ steps.ver.outputs.version }}"

      - name: Set up QEMU (for arm64 buildx layer)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: claudevandort/nanostack
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the published image
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          docker pull "claudevandort/nanostack:${tag}"
          out="$(docker run --rm "claudevandort/nanostack:${tag}" --version)"
          echo "Output: $out"
          test "$out" = "nanostack v${{ steps.ver.outputs.version }}"

      - name: Inspect multi-arch manifest
        run: docker buildx imagetools inspect "claudevandort/nanostack:${{ steps.ver.outputs.tag }}"

      - name: Extract changelog section
        id: notes
        run: |
          version="${{ steps.ver.outputs.version }}"
          if grep -q "^## \[$version\]" docs/CHANGELOG.md; then
            awk "/^## \[$version\]/{flag=1; next} /^## \[/{flag=0} flag" docs/CHANGELOG.md > release-notes-body.md
          else
            echo "No CHANGELOG entry for $version. See docs/CHANGELOG.md." > release-notes-body.md
          fi
          # Append the Docker pull pointer so the Release page tells users
          # exactly how to consume this version.
          cat >> release-notes-body.md <<EOF

          ## Docker

          \`\`\`sh
          docker pull claudevandort/nanostack:${{ steps.ver.outputs.tag }}
          docker run --rm -p 4566:4566 claudevandort/nanostack:${{ steps.ver.outputs.tag }}
          \`\`\`

          Multi-arch image (linux/amd64 + linux/arm64) on Docker Hub.
          Also available as \`:${{ steps.ver.outputs.version }}\`-prefixed and \`:latest\` tags.
          EOF
          echo "----- release notes -----"
          cat release-notes-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: nanostack ${{ steps.ver.outputs.tag }}
          body_path: release-notes-body.md
